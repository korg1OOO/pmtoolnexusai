<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Reminder</title>
</head>

<body
    style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
        style="background-color: #f5f5f5; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                    style="background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(245, 158, 11, 0.2);">
                    <tr>
                        <td style="padding: 40px 40px 20px; text-align: center;">
                            <h1 style="margin: 0; color: #ffffff; font-size: 26px; font-weight: 700;">
                                🔔 Payment Reminder
                            </h1>
                        </td>
                    </tr>
                    <tr>
                        <td
                            style="padding: 0 40px 40px; background-color: #ffffff; border-top-left-radius: 24px; border-top-right-radius: 24px;">
                            <div style="text-align: center; margin: -30px 0 20px;">
                                <div
                                    style="display: inline-block; width: 60px; height: 60px; background: linear-gradient(135deg, #fbbf24, #f59e0b); border-radius: 50%; padding: 15px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);">
                                    <span style="font-size: 30px;">💳</span>
                                </div>
                            </div>
                            <p style="margin: 0 0 20px; color: #4a5568; font-size: 16px; line-height: 1.6;">
                                Hi {{user_name}},
                            </p>
                            <p style="margin: 0 0 20px; color: #4a5568; font-size: 16px; line-height: 1.6;">
                                We attempted to process your payment of <strong>{{amount}}</strong> on {{attempt_date}},
                                but it was unsuccessful.
                            </p>
                            <div
                                style="background-color: #fffbeb; border-left: 4px solid #f59e0b; padding: 16px; margin: 20px 0; border-radius: 8px;">
                                <p style="margin: 0; color: #78350f; font-size: 14px; line-height: 1.6;">
                                    <strong>Note:</strong> This is a friendly reminder. Your service remains active.
                                </p>
                            </div>
                            <div style="text-align: center; margin: 30px 0;">
                                <a href="{{update_payment_url}}"
                                    style="display: inline-block; background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #ffffff; text-decoration: none; padding: 14px 40px; border-radius: 8px; font-size: 15px; font-weight: 600; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);">
                                    Update Payment Method
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 30px 40px; background-color: #1a1a1a; text-align: center;">
                            <p style="margin: 0; color: #718096; font-size: 12px;">
                                Need help? <a href="{{support_url}}"
                                    style="color: #fbbf24; text-decoration: none;">Contact Support</a>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
